<html>
  <head>
    <title>latihan login</title>
    <style>
      body {
        background: radial-gradient(circle, hwb(158 54% 13%), hwb(313 87% 7%))
      }
      .login{
        width: 400px;
        height: 400px;
        background-color: hwb(120 64% 21%);
        padding: 40px;
        margin-top: 50px;
        border-radius: 40px;
        box-shadow: 5px 5px 50px black;
        color:hwb(0 100% 0%);
    
        
      }
      
      h2{
        text-align: center;
        color: hwb(0 100% 0%);
        font-size: 28px;
      }
      .login input {
        width: 100%;
        height: 25px;
        border: none;
        border-radius: 5px;
      }

      .login button{
        width: 100%;
        height: 35px;
        border: none;
        border-radius:50px;
        margin-top: 20px;
      }
      .login button:hover{
        background-color:hwb(120 43% 27%);
        color: beige;
        cursor: pointer;
      }
      .box{
        display: flex;
        justify-content: center;
        align-items:center;
      }
      .login i, a{
        text-decoration: none;
        color: beige;
        
      }
      .login i, a:hover {
        color: hwb(107 49% 26%)
      }
    </style>
  </head>
  <body>
    <div class="box">
    <div class="login">
      <h2>Login</h2>
      <form>
        <label>Username</label><br><br>
        <input type="text" name="username"><br>
        <label>Password</label><br><br>
        <input type="password" name="password"><br><br>
        <button>login</button>
        
      </form>
      <p>Belum punya akun ?
        <i><a href="#" daftar di sini>Daftar Disini</a></i>
      
      
      </p>

    </div>
    </div>



    
  </body>
</html>
